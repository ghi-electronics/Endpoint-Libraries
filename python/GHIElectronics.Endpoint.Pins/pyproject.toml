# Pin constants, bus tables, and board support for every GHI Electronics
# Endpoint board (EPM815, EPDomino24, EPN256, EPN128). One wheel covers
# every Endpoint board; the right board registers itself at import via
# ChipDetect. Raspberry Pi Zero 2 W (not an Endpoint board) lives in
# GHIElectronics.Endpoint.Drivers.RaspberryPi instead.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Pins"
version = "0.5.4"
description = "Pin constants, bus tables, and board support for every GHI Electronics Endpoint board (mirrors .NET GHIElectronics.Endpoint.Pins)."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.4,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/Endpoint-Libraries"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Pins"]
namespaces = true
