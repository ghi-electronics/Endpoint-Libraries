# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/ and
# Endpoint/Devices/), so each can be installed and updated on its own.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Devices.Display"
version = "0.3.0"
description = "Display on GHI Electronics Endpoint: native parallel LCDs, SPI and I2C panels configured in /config/display.json."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.3.0,<0.4",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Devices.Display"]
namespaces = true
