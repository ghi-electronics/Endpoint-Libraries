# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/ and
# Endpoint/Devices/), so each can be installed and updated on its own.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Devices.Media"
version = "0.4.0"
description = "Webcams (Camera: JPEG pictures and streaming from any USB camera) and sound (the API of .NET IoT's SoundDevice: WAV, MP3, recording, volume) of GHI Electronics Endpoint."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.4.0,<0.5",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Devices.Media"]
namespaces = true
