# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/ and
# Endpoint/Devices/), so each can be installed and updated on its own.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Devices.Rtc"
version = "0.5.2"
description = "The real-time clock of GHI Electronics Endpoint, with the API of .NET IoT's RtcBase."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.2,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/Endpoint-Libraries"
Issues = "https://github.com/ghi-electronics/Endpoint-Libraries/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Devices.Rtc"]
namespaces = true
