# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/ and
# Endpoint/Devices/), so each can be installed and updated on its own.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Core"
version = "0.5.3"
description = "The Endpoint's pins, buses and ports, and the libendpoint library, for GHI Electronics Endpoint (the same API as .NET's GHIElectronics.Endpoint.Core)."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/Endpoint-Libraries"
Issues = "https://github.com/ghi-electronics/Endpoint-Libraries/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Core"]
namespaces = true

[tool.setuptools.package-data]
# Dual-arch wheel ships both libendpoint-arm.so (32-bit, EPM815) and
# libendpoint-arm64.so (64-bit, EPN256 / EPN128). _native.py picks at import
# time via platform.machine(). Plain libendpoint.so is accepted too for dev
# installs that only built one arch.
"GHIElectronics.Endpoint.Core" = ["libendpoint*.so"]
