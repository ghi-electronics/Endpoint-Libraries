# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.UI"
version = "0.5.1"
description = "UI widgets for Endpoint: Button, Label, Container, Image, TextBox, Slider, CheckBox on top of the embedded LVGL in libendpoint. Pair with the GHI Electronics UI designer."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "GHIElectronics.Endpoint.Core>=0.5.1,<0.6",
    "GHIElectronics.Endpoint.Devices.Display>=0.5.1,<0.6",
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"
Repository = "https://github.com/ghi-electronics/Endpoint-Libraries"
Issues = "https://github.com/ghi-electronics/Endpoint-Libraries/issues"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.UI", "GHIElectronics.Endpoint.UI.*"]
namespaces = true
