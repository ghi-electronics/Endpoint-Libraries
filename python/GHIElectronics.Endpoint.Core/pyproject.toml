# One of the Endpoint Python packages. They share the namespace
# GHIElectronics.Endpoint (no __init__.py in GHIElectronics/, Endpoint/ and
# Endpoint/Devices/), so each can be installed and updated on its own.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GHIElectronics.Endpoint.Core"
version = "0.2.3"
description = "The EPM815's pins, buses and ports, and the libendpoint library, for GHI Electronics Endpoint (the same API as .NET's GHIElectronics.Endpoint.Core)."
authors = [{ name = "GHI Electronics, LLC", email = "support@ghielectronics.com" }]
requires-python = ">=3.9"
dependencies = [
]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://www.ghielectronics.com/"

[tool.setuptools.packages.find]
include = ["GHIElectronics.Endpoint.Core"]
namespaces = true

[tool.setuptools.package-data]
"GHIElectronics.Endpoint.Core" = ["libendpoint.so"]
